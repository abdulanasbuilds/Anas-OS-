name: ANAS OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical JSON contracts and registries
        run: |
          node -e "for (const p of ['config/anas-os.json','config/domain-registry.json','01-kernel/policies/policy-registry.json','01-kernel/policies/gate-registry.json','01-kernel/objects/registry.json','02-domains/agent-system/registry/agents.json','03-workflows/project-lifecycle.json']) JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('JSON PASS')"
      - name: Test canonical runtime and kernel
        run: npm test
      - name: Validate canonical repository shape
        run: npm run validate
